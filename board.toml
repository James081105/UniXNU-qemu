# Board description of the QEMU AArch64 virt machine (GICv3, Cortex-A710), read by the unixnu build driver.
#
# QEMU stands in for a tablet: the generic EDK II AArch64 firmware that comes with QEMU replaces the device's Mu-Silicium
# port, and scripts/make-qemu-adt.py describes the machine instead of a board tree. UniXNU, DarwinBoot and the kernel
# are the same as on the boards, so they can be tried here first. scripts/run-qemu.py boots the payload.

[board]
name = "qemu"
soc = "QEMU virt"
description = "QEMU AArch64 virt machine"
kit = "qemu"                       # package/ of this repository appears as kits/qemu in the build tree

# The same target OS image as UniXNU-sheng and UniXNU-pipa.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[kernel]
defconfig = "qemu_defconfig"
# Archive builders of the kernel step, in order; the ones qemu_defconfig links.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-libpthread-kernel.py",
  "build-mockfs-fixture.py",
  "build-link-stubs.py",
  "build-platform-power.py",
]

# The same original kernelcache and prelink selection as the boards: the target image is the same.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# No [firmware]: QEMU runs its own EDK II AArch64 firmware, which has no DarwinBoot. The payload therefore loads
# DarwinBoot as a driver from Payloads/DarwinBoot.efi; scripts/run-qemu.py builds it and puts it there.
[payload]
volume = "QEMUESP"
size_mib = 192
loader = "driver"
title = "QEMU virt: source 4K XNU"
dram_size = "0x180000000"            # the 6 GiB scripts/run-qemu.py gives the machine
skip_setup_tool = "scripts/seed-data-skip-setup.py"
panic_screen = true
# The trust caches the payload step accepts for --trust-cache.  Two kinds, and
# the difference is the whole point of the list:
#
#   * the ORIGINAL one (7416ca4f...) -- build-original-system-trust.py's output,
#     the two original modules byte for byte.  Measured 2026-10-31: without any
#     owner module AMFI runs launchd but refuses the QemuMetal plugin, so the
#     plugin cannot load no matter what else is right.
#   * the OWNER ones -- an original module pair plus this board's own module,
#     which carries the CDHash of one binary this board builds.
#
# The owner entry is 2a4b737e..., the QemuMetal owner trust cache
# (build-qemu-metal.py guest), whose own module carries
# QemuMetal.bundle's CDHash 6080ce8fac2b57b2fdd1046663bb536a2d2996ab.
#
# This digest MOVED until -Wl,-no_uuid was added to the bundle's link, and the
# history is recorded because one reading of it was wrong.  Measured:
#
#   run 41108366328 (no -no_uuid)  CDHash a1fce7f8870b9ea068add82ddaa4bfd5b1343aad
#                                   owner-trust.bundle 665af2ff7440ec1404522c7e2ddbf45e...
#   run 41117052708 (no -no_uuid)  CDHash 68518f18395a53dac252b52b2481902af17faa0c
#                                   owner-trust.bundle b646229b20c7f08e41ce2fe62c8fc01e...
#   run 41125151494 (-no_uuid)     CDHash 6080ce8fac2b57b2fdd1046663bb536a2d2996ab
#                                   owner-trust.bundle 2a4b737e1fd2fc073678c9ccf4cf71de...
#   run 41132638822 (-no_uuid)     CDHash 6080ce8fac2b57b2fdd1046663bb536a2d2996ab
#                                   owner-trust.bundle 2a4b737e1fd2fc073678c9ccf4cf71de...
#
# The first revision of this comment declared LC_UUID refuted after the third
# run, on one data point with the flag.  That was wrong: the fourth run matched
# the third exactly, in the CDHash AND in the derived cache -- and the cache is
# a pure function of the CDHash, so a matching cache digest is a byte-level
# confirmation rather than a second opinion about the same hash.  Two runs
# without the flag disagreed; two runs with it agree.
#
# AND IT DID, the first time a source was added rather than a flag changed.  Run
# 41158729773 (2026-10-31) built the bundle with QemuMetalScanout.mm linked in
# -- the display hand-off's client, which nothing had been starting -- and got
# CDHash c7f7af6f36c0621be6d33c3f0c5bf773cfd4fa45 with owner-trust.bundle
# ff1590682bac17cdfd46dfe169341d27c0428276da5bd41562725fb1a521e2cd, against the
# pinned 6080ce8f... / 2a4b737e... from the previous five runs.  The payload step
# refused, naming this list:
#   unixnu: .../build/qemu-metal/owner-trust.bundle is not one of the trust
#   caches this board accepts (board.toml [payload] trust_cache_sha256)
# That is the allowlist doing exactly what it is for -- a visible re-pin, not a
# silent one -- and it is why the entry above is now fourth rather than third.
# The same run also proves the new source compiles and links: the kernel step and
# build-qemu-metal.py guest both succeeded, and the seed grew from 4,772,048 to
# 4,796,608 packed bytes.
#
# The digest is still expected to change whenever the bundle's SOURCES change,
# and then the payload step refuses here, naming this list -- a visible re-pin
# rather than a silent one.  What it must never become is a wildcard.
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
  "2a4b737e1fd2fc073678c9ccf4cf71de00d2ce77c001ce0ea702bea00041ded0",
  "ff1590682bac17cdfd46dfe169341d27c0428276da5bd41562725fb1a521e2cd",
]
# The arguments of UniXNU-pipa. sheng-pmgr=2 publishes the original PMGR nub through the bridge;
# -apfs_shared_datavolume, as on sheng, lets the user-management stack use the one Data volume of qemu_root_defconfig.
# The offline-* arguments start qemu_root_defconfig's display, with the values of sheng's board.toml: load
# IOMobileGraphicsFamily, create the display (offline-legacy-register), publish it under /arm-io as the system display
# (phase 4) on the UEFI frame buffer (gop), at one frame-buffer pixel per point (unit-scale=1), with firmware-powered
# power management, swap validation, the CPU copy to the frame buffer and retirement of each copied frame. Under
# qemu_defconfig there is no display, and offline-legacy-register reaches the no-op of package/LinkStubs.c.
# offline-key-events=1 and sheng-aks=1 start NativeKeyStoreEvents from the same archive, as on sheng: an AppleKeyStore
# stand-in that answers the state queries (no keybag, no passcode, nothing locked). Without it MKBEventsRegister fails,
# liveactivitiesd crashes at every start, chronod waits on it and SpringBoard on chronod, so it never takes over the
# display and the render server ignores every update.
# offline-hid-input=1, offline-hid-home=1 and sheng-touch-hid=1 start NativeHidInput, as on sheng: a HID device with a
# keyboard, the Home button and a touch screen, whose fingers package/TouchState.cpp publishes.
kernel_args = [
  "-apfs_shared_datavolume",
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "armcpu-diagnostics=1",
  "sheng-pmgr=2",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "offline-mobile-graphics-load=1",
  "offline-legacy-register=1",
  "offline-legacy-phase=4",
  "offline-legacy-gop=1",
  # How long the display probe's own thread waits for IOCoreSurfaceRoot before
  # giving up.  The default is 120000 and it is the single largest cause of a
  # boot that reaches the userland and then shows no display at all.
  #
  # MEASURED over ten boots of one matched build on the Windows host: four
  # reached native_legacy_stage=10 and six stopped at stage 8, which is the
  # give-up path -- native_legacy_surface_status was 0 (the IOSurface kext
  # loaded) and surface_found was 0, i.e. waitForMatchingService() timed out.
  # Raising this to 600000 took the same build to stage 10 on both of the next
  # two boots, with surface_found=1, unit_scale_calls=1, chosen_scale=1 and
  # native_gop_ready=1.
  #
  # The wait is on its own thread (that is what the fork's first commit bought),
  # so a longer value costs nothing but time on a boot that is going to fail
  # anyway -- and a boot that loses the display silently is the expensive kind.
  # 120 s was calibrated for a boot whose mountroot completed at t=49.6 s and
  # whose surface landed at t=63.6 s; the stalled boots are roughly twice as
  # slow throughout, which is what puts the surface past the deadline.
  "offline-legacy-surface-wait-ms=600000",
  "offline-legacy-unit-scale=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-key-events=1",
  "sheng-aks=1",
  "offline-hid-input=1",
  "offline-hid-home=1",
  "sheng-touch-hid=1",
  # The GPU display hand-off.  native_gop_ready is written at
  # NativeGOPPresenter.cpp:97, inside NativeGOPPresenter::start(); nothing else
  # in the tree writes it.  start() runs only if something constructs the
  # object, which happens at exactly two sites, both in
  # package/LegacyDisplayProbe.cpp: line 553 under `phase == 3`, and line 568
  # under `phase == 4 && sheng-fb-gpu == 1`.  So with phase=4 this argument IS
  # what constructs the presenter.
  #
  # CORRECTED 2026-10-29, and the correction retracts a refutation that was
  # itself wrong.  The revision after this one recorded four controlled boots
  # said to show the presenter exists without the argument, and rewrote this
  # comment around that table.  It was measuring the wrong thing:
  # scripts/macos/../unipad/host/unixnu_boot.py's stage_esp() GENERATES
  # unixnu.toml from board.toml when BootInputs.payload_toml is None, so the
  # payload image's own unixnu.toml is never read and the args that boot are
  # THIS FILE's.  Every one of those four boots therefore carried
  # sheng-fb-gpu=1 from here; the "control" compared
  # "sheng-fb-gpu=1" against "sheng-fb-gpu=1 ... sheng-fb-gpu=0", which is
  # exactly what the source predicts and refutes nothing.  Verified directly:
  # for the build whose payload.json has no sheng-fb-gpu, the staged args have
  # it and the difference is this one entry.
  #
  # The console conditions NativeGOPPresenter::start() checks (PE_current_console,
  # 32bpp, no rotation, rowBytes >= width*4) are satisfied on this guest: the
  # legacy probe at line 455 checks the identical set to reach stage 2, and the
  # guest reports surface_found=1 / stage=10 on the boots that get that far.
  #
  # The limit, stated because it is the next thing to measure: gpuMode makes the
  # presenter OFFER each finished frame to a privileged client instead of having
  # the legacy display copy it (NativeLegacyDisplay.cpp:34), so with no client
  # the offer is abandoned -- native_gop_gpu_offers and
  # native_gop_gpu_abandoned are the counters that will say so, and they are
  # already in the binary.  frame_count=0 is the same story from the other side:
  "sheng-fb-gpu=1",
  # The GPU addon mount, which the kernel gates behind this exact argument:
  # zzy-native-gpu-addon-mount.patch's native_gpu_addon_prepare() returns before
  # touching anything unless PE_parse_boot_argn("sheng-gpu-addon") reads 1.
  # Measured absent until now -- native_gpu_addon_stage stayed 0 and
  # native_gpu_addon_status stayed -1 (its initial value) across every boot, so
  # the addon mount was never attempted at all.
  # This is the USERSPACE half of the display stack (the Adreno Metal plugin,
  # the probe daemon and the backboardd job plist), and it is a separate axis
  # from sheng-fb-gpu above: the presenter is a kernel IOService and does not
  # consult the addon, while the addon is the client that would answer the
  # presenter's offer.  An earlier revision of this comment claimed
  # native_gop_ready=0 was this argument's consequence; that was wrong, and
  # reading NativeGOPPresenter::start() against the two creation sites above is
  # what showed it.
  # The addon presents /private/var/ngpu/addons over /System/Library/Extensions
  # (AGXMetalA10, NativeAdrenoMetal), /private/var/ngpu/daemons over
  # /System/Library/LaunchDaemons (com.apple.backboardd) and the iPadOS 17
  # wallpaper over its sealed asset.  board.toml's own note above says the render
  # server ignores every update without that daemon stack, which is the symptom
  # this is meant to answer.  NOTE: the build does not yet produce
  # /private/var/ngpu on the Data seed, so this turns a silent skip into a
  # measured attempt whose failure reason is now visible in the addon counters.
  "sheng-gpu-addon=1",
]

[payload.adt]
tool = "scripts/make-qemu-adt.py"
chip_id = "207"
owned_memory_size = "0x100000000"    # 4 GiB, as on pipa
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
cpu_regs = "0"                       # one CPU
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"          # .cache/platform-seed holds the one this checkout uses
